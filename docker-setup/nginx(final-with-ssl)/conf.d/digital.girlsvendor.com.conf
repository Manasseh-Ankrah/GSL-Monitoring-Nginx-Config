upstream gsl_backend {
    least_conn;

    server spring-app-1:8080;
    server spring-app-2:8081;
}

# HTTP Block
server {

    listen 80;

    server_name digital.girlsvendor.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://gsl_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


# HTTPS Block
server {

    listen 443 ssl;
    server_name digital.girlsvendor.com;


    ssl_certificate /etc/letsencrypt/live/digital.girlsvendor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/digital.girlsvendor.com/privkey.pem;


    location / {

        proxy_pass http://gsl_backend;


        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto https;

    }

}